providers:
    - Workbench\App\Providers\WorkbenchServiceProvider

migrations:
    - workbench/database/migrations

seeders:
    - Workbench\Database\Seeders\DatabaseSeeder

workbench:
    start: '/'
    install: true
    discovers:
        web: true
        api: false
        commands: false
        components: true
        views: true
    build:
        - create-sqlite-db
    assets: []
    sync: []
